map kitty_mod+t
map kitty_mod+b kitten kittens/bg_picker.py
# map kitty_mod+n previous_tab
# map kitty_mod+h next_tab
# new_tab + переключение раскладки на базовую (индекс 0: Hyprland — hyprctl, KDE — busctl)
map kitty_mod+t combine : new_tab : launch --type=background /home/andrei/.config/kitty/scripts/switch-layout

map kitty_mod+n previous_tab

map kitty_mod+h next_tab
map kitty_mod+s
map kitty_mod+p launch --type=background /home/andrei/.config/hypr/scripts/smart-close.sh
# Transfer current tab to another kitty OS window
map kitty_mod+j launch --type=background --copy-env /home/andrei/.config/hypr/scripts/kitty-transfer.sh
map kitty_mod+l        next_layout
# map kitty_mod+d launch --cwd=current
map kitty_mod+d new_os_window_with_cwd
map kitty_mod+m detach_window new-os-window
# map kitty_mod+j detach_window ask
map kitty_mod+w detach_window ask

# moves the window into a new tab
map kitty_mod+v detach_window new-tab
map kitty_mod+y combine : new_tab nu -c yazi : launch --type=background /home/andrei/.config/kitty/scripts/switch-layout


map ctrl+shift+f kitten kittens/toggle_font_size.py
map ctrl+shift+w kitten kittens/shortcuts.py
map kitty_mod+a kitten kittens/ai_menu.py
map kitty_mod+f kitten kittens/ai_menu.py
map kitty_mod+x kitty_scrollback_nvim
map kitty_mod+g kitten kittens/tab_menu.py
map kitty_mod+i kitten kittens/tab_debug.py

# Global Pi sessions browser (resume inactive session in a new tab)
map kitty_mod+u kitten kittens/pi_sessions.py
map kitty_mod+г kitten kittens/pi_sessions.py

# Shift+Enter → CSI-u. Нужно для терминальных приложений на prompt_toolkit
# (например, Hermes), которые не активируют kitty keyboard protocol сами.
# Когда приложение его всё-таки активирует (Claude Code), kitty игнорирует
# этот маппинг и шлёт CSI-u сама — конфликта нет.
map shift+enter send_text all \x1b[13;2u
