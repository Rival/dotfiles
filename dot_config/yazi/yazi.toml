[mgr]
show_hidden = true
show_symlink = true
linemode = "size_and_mtime"
ratio = [2,7,5]

[opener]
play = [
  { run = 'mpv "$@"', orphan = true, for = "unix" },
]
edit = [
  { run = '"$EDITOR" "$@"', block = true, for = "unix" },
]
open = [
  { run = 'xdg-open "$@"', desc = "Open" },
  # { run = '''clear; exiftool "$1"; echo "Press enter to exit"; read _''', block = true, desc = "Show EXIF", for = "unix" },
]

[open]
prepend_rules = [
  { url = "*.json", use = "edit" },
  { url = "*.sh", use = "edit" },
  { url = "*.toml", use = "edit" },
  { url = "*.y*ml", use = "edit" },
  { url = "*config", use = "edit" },
  { url = "*.cfg", use = "edit" },
  { url = "*env", use = "edit" },
  { url = "*.d", use = "edit" },
  { url = "*.md", use = "edit" },
  { url = "*.txt", use = "edit" },
  { url = ".zsh*", use = "edit" },
  { url = "*.ini", use = "edit" },
  { url = "*.lua", use = "edit" },
  { url = "*.xml", use = "edit" },
  { url = "*.log", use = "edit" },
  { url = "*.ods", use = "open" },
  { url = "*.pdf", use = "open" },
  { url = "*.mp3", use = "play" },
]
append_rules = []

[plugin]
prepend_spotters = [
{ mime = "image/*", run = "spot-image" },
{ mime = 'audio/mpegurl', run = 'code' }, # ignore .m3u files
{ url = "audio/*", run = "spot-audio" },
{ url = "video/*", run = "spot-video" }
]
prepend_previewers = [
  { url = "*.csv", run = 'piper -- bat -p --color=always "$1"' },
  { url = "*.md", run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"' },
]
